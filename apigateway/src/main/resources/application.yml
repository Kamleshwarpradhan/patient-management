#spring.application.name=apigateway
server:
  port: 8088 # Gateway listens on port 8088

auth:
  service:
    url: http://auth-service:8083

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      server:
        webflux:
          routes:
            - id: auth-users-route
              uri: http://auth-service:8083
              predicates:
                - Path=/auth/users,/auth/users/**,/auth/user/**
              filters:
                - StripPrefix=1
                - JwtValidation

            - id: doctor-service-route
              uri: http://doctor-service:8086
              predicates:
                - Path=/api/doctors/**,/api/doctor/**
              filters:
                - StripPrefix=1
                - JwtValidation

            - id: auth-service-route
              uri: http://auth-service:8083
              predicates:
                  - Path=/auth/**
              filters:
                  - StripPrefix=1

            - id: patient-service-route
              uri: http://patient-service:8080
              predicates:
                - Path=/api/patient/**
              filters:
                - StripPrefix=1
                - JwtValidation

            - id: api-docs-patient-route
              uri: http://patient-service:8080
              predicates:
                - Path=/api-docs/patient
              filters:
                - RewritePath=/api-docs/patient,/v3/api-docs

            - id: api-docs-auth-route
              uri: http://auth-service:8083
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth,/v3/api-docs

            - id: appointment-service-route
              uri: http://appointment-service:8084
              predicates:
                  - Path=/api/appointments/**
              filters:
                  - StripPrefix=1
                  - JwtValidation

            - id: notification-service-route
              uri: http://notification-service:8085
              predicates:
                  - Path=/api/notifications/**
              filters:
                  - StripPrefix=1
                  - JwtValidation
